<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WX</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>
<body>
  <header>
    <div class="header-row">
      <h1>WX</h1>
      <div class="search-container">
        <input type="text"
               id="search-input"
               name="q"
               placeholder="Search city..."
               autocomplete="off"
               hx-get="/search"
               hx-trigger="input changed delay:300ms"
               hx-target="#search-results">
        <div id="search-results"></div>
      </div>
    </div>
  </header>

  <div id="favorites-bar" class="favorites-bar"></div>

  <main id="forecast-container">
    <div class="loading" id="loading-msg">
      <span class="loading-text">Locating...</span>
    </div>
  </main>

  <footer class="site-footer">
    <span>Built by <a href="https://spencergreene.com">Spencer Greene</a></span>
    <span><a href="https://github.com/spwg/weather">Source</a></span>
  </footer>

  <script>
    // --- Hash state helpers ---

    function parseHash() {
      var hash = window.location.hash.substring(1);
      if (!hash) return null;
      var p = new URLSearchParams(hash);
      if (p.has('nearby')) {
        return { nearby: true, lat: p.get('lat'), lon: p.get('lon') };
      }
      var lat = p.get('lat');
      var lon = p.get('lon');
      if (!lat || !lon) return null;
      return { lat: lat, lon: lon, name: p.get('name') || '' };
    }

    function buildHash(lat, lon, name) {
      var h = 'lat=' + lat + '&lon=' + lon;
      if (name) h += '&name=' + encodeURIComponent(name);
      return '#' + h;
    }

    function setHash(lat, lon, name, replace) {
      var hash = buildHash(lat, lon, name);
      var state = { lat: lat, lon: lon, name: name };
      if (replace) {
        history.replaceState(state, '', hash);
      } else {
        history.pushState(state, '', hash);
      }
    }

    function loadLocation(lat, lon, name) {
      var url = '/forecast?lat=' + lat + '&lon=' + lon;
      if (name) url += '&name=' + encodeURIComponent(name);
      htmx.ajax('GET', url, { target: '#forecast-container' });
    }

    // --- Search keyboard navigation ---

    var searchActiveIndex = -1;

    function getSearchItems() {
      return document.querySelectorAll('#search-results .search-results-list li');
    }

    function updateSearchHighlight() {
      var items = getSearchItems();
      for (var i = 0; i < items.length; i++) {
        if (i === searchActiveIndex) {
          items[i].classList.add('search-active');
        } else {
          items[i].classList.remove('search-active');
        }
      }
      if (searchActiveIndex >= 0 && items[searchActiveIndex]) {
        items[searchActiveIndex].scrollIntoView({ block: 'nearest' });
      }
    }

    // --- Favorites localStorage API ---

    var FAV_KEY = 'wx-favorites';

    function getFavorites() {
      try { return JSON.parse(localStorage.getItem(FAV_KEY)) || []; }
      catch (e) { return []; }
    }

    function saveFavorites(favs) {
      localStorage.setItem(FAV_KEY, JSON.stringify(favs));
    }

    function addFavorite(name, lat, lon) {
      var favs = getFavorites();
      var key = lat + ',' + lon;
      for (var i = 0; i < favs.length; i++) {
        if (favs[i].lat + ',' + favs[i].lon === key) return false;
      }
      favs.push({ name: name, lat: lat, lon: lon });
      saveFavorites(favs);
      return true;
    }

    function removeFavorite(lat, lon) {
      var favs = getFavorites();
      var key = lat + ',' + lon;
      saveFavorites(favs.filter(function(f) { return f.lat + ',' + f.lon !== key; }));
    }

    function isFavorite(lat, lon) {
      var favs = getFavorites();
      var key = lat + ',' + lon;
      for (var i = 0; i < favs.length; i++) {
        if (favs[i].lat + ',' + favs[i].lon === key) return true;
      }
      return false;
    }

    // --- Favorites UI ---

    function escapeHtml(s) {
      var el = document.createElement('span');
      el.textContent = s;
      return el.innerHTML;
    }

    function renderFavorites() {
      var bar = document.getElementById('favorites-bar');
      var favs = getFavorites();
      if (favs.length === 0) { bar.style.display = 'none'; bar.innerHTML = ''; return; }
      bar.style.display = 'flex';
      var html = '';
      for (var i = 0; i < favs.length; i++) {
        var f = favs[i];
        var safeName = f.name.replace(/'/g, "\\'");
        html += '<button class="fav-item" onclick="loadFavorite(\'' +
          f.lat + "','" + f.lon + "','" + safeName + '\')">' +
          escapeHtml(f.name) +
          '<span class="fav-remove" onclick="event.stopPropagation();removeFavAndRender(\'' +
          f.lat + "','" + f.lon + '\')">\u00d7</span></button>';
      }
      bar.innerHTML = html;
    }

    function loadFavorite(lat, lon, name) {
      setHash(lat, lon, name);
      loadLocation(lat, lon, name);
      document.getElementById('search-input').value = name;
    }

    function removeFavAndRender(lat, lon) {
      removeFavorite(lat, lon);
      renderFavorites();
      updateStarState();
    }

    // --- Star button ---

    function toggleFavorite(btn) {
      var lat = btn.getAttribute('data-lat');
      var lon = btn.getAttribute('data-lon');
      var name = btn.getAttribute('data-name');
      if (isFavorite(lat, lon)) {
        removeFavorite(lat, lon);
      } else {
        addFavorite(name, lat, lon);
      }
      renderFavorites();
      updateStarState();
    }

    function updateStarState() {
      var btn = document.getElementById('fav-star-btn');
      if (!btn) return;
      var lat = btn.getAttribute('data-lat');
      var lon = btn.getAttribute('data-lon');
      if (isFavorite(lat, lon)) {
        btn.innerHTML = '\u2605';
        btn.classList.add('fav-star-active');
        btn.title = 'Remove from favorites';
      } else {
        btn.innerHTML = '\u2606';
        btn.classList.remove('fav-star-active');
        btn.title = 'Add to favorites';
      }
    }

    // --- htmx afterSwap sync ---

    document.body.addEventListener('htmx:afterSwap', function(e) {
      if (e.detail.target.id === 'forecast-container') {
        updateStarState();
        renderFavorites();
      }
      if (e.detail.target.id === 'search-results') {
        searchActiveIndex = -1;
      }
    });

    // --- Back/forward navigation ---

    window.addEventListener('popstate', function() {
      var loc = parseHash();
      if (!loc) return;
      if (loc.nearby) {
        htmx.ajax('GET', '/nearby?lat=' + loc.lat + '&lon=' + loc.lon, {target: '#forecast-container'});
      } else {
        loadLocation(loc.lat, loc.lon, loc.name);
        document.getElementById('search-input').value = loc.name;
      }
    });

    // --- Page load ---

    document.addEventListener('DOMContentLoaded', function() {
      renderFavorites();

      var hashLoc = parseHash();
      if (hashLoc) {
        loadLocation(hashLoc.lat, hashLoc.lon, hashLoc.name);
        if (hashLoc.name) {
          document.getElementById('search-input').value = hashLoc.name;
        }
      } else if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          function(pos) {
            var lat = pos.coords.latitude.toFixed(4);
            var lon = pos.coords.longitude.toFixed(4);
            htmx.ajax('GET', '/nearby?lat=' + lat + '&lon=' + lon, {target: '#forecast-container'});
            history.replaceState({nearby: true}, '', '#nearby&lat=' + lat + '&lon=' + lon);
          },
          function() {
            document.getElementById('forecast-container').innerHTML =
              '<div class="prompt">Enter a city above to get started.</div>';
          },
          { timeout: 8000 }
        );
      } else {
        document.getElementById('forecast-container').innerHTML =
          '<div class="prompt">Enter a city above to get started.</div>';
      }

      // Close search results when clicking outside
      document.addEventListener('click', function(e) {
        if (!e.target.closest('.search-container')) {
          document.getElementById('search-results').innerHTML = '';
        }
      });

      // Close search results on escape
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
          document.getElementById('search-results').innerHTML = '';
          document.getElementById('search-input').blur();
        }
      });

      // Arrow key navigation for search results
      document.getElementById('search-input').addEventListener('keydown', function(e) {
        var items = getSearchItems();
        if (items.length === 0) return;

        if (e.key === 'ArrowDown') {
          e.preventDefault();
          searchActiveIndex = (searchActiveIndex + 1) % items.length;
          updateSearchHighlight();
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          searchActiveIndex = (searchActiveIndex - 1 + items.length) % items.length;
          updateSearchHighlight();
        } else if (e.key === 'Enter') {
          e.preventDefault();
          if (searchActiveIndex >= 0 && items[searchActiveIndex]) {
            items[searchActiveIndex].click();
          }
        }
      });
    });
  </script>
</body>
</html>
