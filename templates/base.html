<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WX</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  {{if .DevMode}}<script src="http://localhost:35729/livereload.js"></script>{{end}}
</head>
<body>
  <header>
    <div class="header-row">
      <h1>WX</h1>
      <form class="search-container" id="search-form" action="/search" method="get"
            hx-get="/search"
            hx-trigger="submit"
            hx-target="#forecast-container"
            hx-push-url="false">
        <input type="text"
               id="search-input"
               name="q"
               placeholder="Search city"
               autocomplete="off">
        <button type="submit" class="search-btn" title="Search"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></button>
      </form>
      <button id="locate-btn" class="locate-btn" onclick="refreshLocation()" title="Use current location"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="3,11 22,2 13,21 11,13 3,11"/></svg></button>
      <button id="settings-btn" class="settings-btn" onclick="toggleSettings()" title="Settings">&#9881;</button>
    </div>
  </header>

  <div id="settings-panel" class="settings-panel">
    <div class="settings-header">
      <span class="settings-title">Settings</span>
      <button class="settings-close" onclick="toggleSettings()" title="Close">&times;</button>
    </div>
    <div class="settings-group">
      <label class="settings-label">Temperature</label>
      <div class="settings-options">
        <button id="temp-f-btn" class="settings-option" onclick="setTempPref('f')">°F</button>
        <button id="temp-c-btn" class="settings-option" onclick="setTempPref('c')">°C</button>
      </div>
    </div>
    <div class="settings-group">
      <label class="settings-label">Precipitation</label>
      <div class="settings-options">
        <button id="precip-in-btn" class="settings-option" onclick="setPrecipPref('in')">in</button>
        <button id="precip-mm-btn" class="settings-option" onclick="setPrecipPref('mm')">mm</button>
      </div>
    </div>
  </div>

  <div id="favorites-bar" class="favorites-bar"></div>

  <main id="forecast-container">
    <div class="loading" id="loading-msg">
      <span class="loading-text">Locating...</span>
    </div>
  </main>

  <footer class="site-footer">
    <span>Built by <a href="https://spencergreene.com">Spencer Greene</a></span>
    <span><a href="https://github.com/spwg/weather">Source</a></span>
  </footer>

  <script>
    // --- Hash state helpers ---

    function parseHash() {
      var hash = window.location.hash.substring(1);
      if (!hash) return null;
      var p = new URLSearchParams(hash);
      if (p.has('nearby')) {
        return { nearby: true, lat: p.get('lat'), lon: p.get('lon') };
      }
      var lat = p.get('lat');
      var lon = p.get('lon');
      if (!lat || !lon) return null;
      return { lat: lat, lon: lon, name: p.get('name') || '', day: p.get('day') || '' };
    }

    function buildHash(lat, lon, name) {
      var h = 'lat=' + lat + '&lon=' + lon;
      if (name) h += '&name=' + encodeURIComponent(name);
      return '#' + h;
    }

    function setHash(lat, lon, name, replace) {
      var hash = buildHash(lat, lon, name);
      var state = { lat: lat, lon: lon, name: name };
      if (replace) {
        history.replaceState(state, '', hash);
      } else {
        history.pushState(state, '', hash);
      }
    }

    function setHashWithDay(lat, lon, name, day) {
      var h = 'lat=' + lat + '&lon=' + lon;
      if (name) h += '&name=' + encodeURIComponent(name);
      if (day) h += '&day=' + day;
      var hash = '#' + h;
      var state = { lat: lat, lon: lon, name: name, day: day };
      history.pushState(state, '', hash);
    }

    function loadDayForecast(lat, lon, name, day) {
      var url = '/day-forecast?lat=' + lat + '&lon=' + lon + '&day=' + day;
      if (name) url += '&name=' + encodeURIComponent(name);
      htmx.ajax('GET', url, { target: '#forecast-container' });
    }

    function loadForecastFromDay() {
      var loc = parseHash();
      if (!loc) return;
      // Remove day from hash and load the 7-day forecast
      setHash(loc.lat, loc.lon, loc.name);
      loadLocation(loc.lat, loc.lon, loc.name);
    }

    function loadLocation(lat, lon, name) {
      var url = '/forecast?lat=' + lat + '&lon=' + lon;
      if (name) url += '&name=' + encodeURIComponent(name);
      htmx.ajax('GET', url, { target: '#forecast-container' });
    }

    // --- Favorites localStorage API ---

    var FAV_KEY = 'wx-favorites';

    function getFavorites() {
      try { return JSON.parse(localStorage.getItem(FAV_KEY)) || []; }
      catch (e) { return []; }
    }

    function saveFavorites(favs) {
      localStorage.setItem(FAV_KEY, JSON.stringify(favs));
    }

    function addFavorite(name, lat, lon) {
      var favs = getFavorites();
      var key = lat + ',' + lon;
      for (var i = 0; i < favs.length; i++) {
        if (favs[i].lat + ',' + favs[i].lon === key) return false;
      }
      favs.push({ name: name, lat: lat, lon: lon });
      saveFavorites(favs);
      return true;
    }

    function removeFavorite(lat, lon) {
      var favs = getFavorites();
      var key = lat + ',' + lon;
      saveFavorites(favs.filter(function(f) { return f.lat + ',' + f.lon !== key; }));
    }

    function isFavorite(lat, lon) {
      var favs = getFavorites();
      var key = lat + ',' + lon;
      for (var i = 0; i < favs.length; i++) {
        if (favs[i].lat + ',' + favs[i].lon === key) return true;
      }
      return false;
    }

    // --- Favorites UI ---

    function escapeHtml(s) {
      var el = document.createElement('span');
      el.textContent = s;
      return el.innerHTML;
    }

    function renderFavorites() {
      var bar = document.getElementById('favorites-bar');
      var favs = getFavorites();
      if (favs.length === 0) { bar.style.display = 'none'; bar.innerHTML = ''; return; }
      bar.style.display = 'flex';
      var html = '';
      for (var i = 0; i < favs.length; i++) {
        var f = favs[i];
        var safeName = f.name.replace(/'/g, "\\'");
        html += '<button class="fav-item" onclick="loadFavorite(\'' +
          f.lat + "','" + f.lon + "','" + safeName + '\')">' +
          escapeHtml(f.name) +
          '<span class="fav-remove" onclick="event.stopPropagation();removeFavAndRender(\'' +
          f.lat + "','" + f.lon + '\')">\u00d7</span></button>';
      }
      bar.innerHTML = html;
    }

    function loadFavorite(lat, lon, name) {
      setHash(lat, lon, name);
      loadLocation(lat, lon, name);
      document.getElementById('search-input').value = name;
    }

    function removeFavAndRender(lat, lon) {
      removeFavorite(lat, lon);
      renderFavorites();
      updateStarState();
    }

    // --- Star button ---

    function toggleFavorite(btn) {
      var lat = btn.getAttribute('data-lat');
      var lon = btn.getAttribute('data-lon');
      var name = btn.getAttribute('data-name');
      if (isFavorite(lat, lon)) {
        removeFavorite(lat, lon);
      } else {
        addFavorite(name, lat, lon);
      }
      renderFavorites();
      updateStarState();
    }

    function updateStarState() {
      var btn = document.getElementById('fav-star-btn');
      if (!btn) return;
      var lat = btn.getAttribute('data-lat');
      var lon = btn.getAttribute('data-lon');
      if (isFavorite(lat, lon)) {
        btn.innerHTML = '\u2605';
        btn.classList.add('fav-star-active');
        btn.title = 'Remove from favorites';
      } else {
        btn.innerHTML = '\u2606';
        btn.classList.remove('fav-star-active');
        btn.title = 'Add to favorites';
      }
    }

    // --- Unit preferences localStorage API ---

    var TEMP_UNIT_KEY = 'wx-temp-unit';
    var PRECIP_UNIT_KEY = 'wx-precip-unit';

    function getTempUnit() {
      return localStorage.getItem(TEMP_UNIT_KEY) || 'f';
    }

    function setTempUnit(unit) {
      localStorage.setItem(TEMP_UNIT_KEY, unit);
    }

    function getPrecipUnit() {
      return localStorage.getItem(PRECIP_UNIT_KEY) || 'in';
    }

    function setPrecipUnit(unit) {
      localStorage.setItem(PRECIP_UNIT_KEY, unit);
    }

    function formatTemp(f, unit) {
      if (unit === 'c') {
        var c = Math.round((f - 32) * 5 / 9);
        return c + '°';
      }
      return f + '°';
    }

    function formatPrecip(inches, unit) {
      if (unit === 'mm') {
        var mm = inches * 25.4;
        return mm.toFixed(1) + 'mm';
      }
      return inches.toFixed(2) + '"';
    }

    function applyUnits() {
      var tempUnit = getTempUnit();
      var precipUnit = getPrecipUnit();

      // Update all temperature elements
      document.querySelectorAll('[data-temp-f]').forEach(function(el) {
        var f = parseFloat(el.getAttribute('data-temp-f'));
        if (!isNaN(f)) {
          el.textContent = formatTemp(f, tempUnit);
        }
      });

      // Update all precipitation elements (only those with data-precip-in)
      document.querySelectorAll('[data-precip-in]').forEach(function(el) {
        var inches = parseFloat(el.getAttribute('data-precip-in'));
        if (!isNaN(inches) && inches >= 0) {
          el.textContent = formatPrecip(inches, precipUnit);
        }
      });

      // Update active state on settings buttons
      document.getElementById('temp-f-btn').classList.toggle('active', tempUnit === 'f');
      document.getElementById('temp-c-btn').classList.toggle('active', tempUnit === 'c');
      document.getElementById('precip-in-btn').classList.toggle('active', precipUnit === 'in');
      document.getElementById('precip-mm-btn').classList.toggle('active', precipUnit === 'mm');
    }

    function setTempPref(unit) {
      setTempUnit(unit);
      applyUnits();
    }

    function setPrecipPref(unit) {
      setPrecipUnit(unit);
      applyUnits();
    }

    function toggleSettings() {
      var panel = document.getElementById('settings-panel');
      panel.classList.toggle('open');
    }

    // --- Location refresh ---

    function refreshLocation() {
      if (!navigator.geolocation) {
        document.getElementById('forecast-container').innerHTML =
          '<div class="prompt">Geolocation is not supported by your browser.</div>';
        return;
      }
      document.getElementById('forecast-container').innerHTML =
        '<div class="loading"><span class="loading-text">Locating...</span></div>';
      document.getElementById('search-input').value = '';
      navigator.geolocation.getCurrentPosition(
        function(pos) {
          var lat = pos.coords.latitude.toFixed(4);
          var lon = pos.coords.longitude.toFixed(4);
          htmx.ajax('GET', '/nearby?lat=' + lat + '&lon=' + lon, {target: '#forecast-container'});
          history.replaceState({nearby: true}, '', '#nearby&lat=' + lat + '&lon=' + lon);
        },
        function() {
          document.getElementById('forecast-container').innerHTML =
            '<div class="prompt">Unable to determine your location. Please try again or search for a city.</div>';
        },
        { timeout: 8000 }
      );
    }

    // --- Live clock ---

    function startClock() {
      var el = document.getElementById('local-clock');
      if (!el) return;
      var tz = el.getAttribute('data-tz');
      function tick() {
        try {
          el.textContent = new Date().toLocaleString('en-US', {
            timeZone: tz,
            hour: 'numeric', minute: '2-digit', second: '2-digit',
            hour12: true, timeZoneName: 'short'
          });
        } catch(e) { el.textContent = tz; }
      }
      tick();
      if (window._clockInterval) clearInterval(window._clockInterval);
      window._clockInterval = setInterval(tick, 1000);
    }

    // --- htmx afterSwap sync ---

    document.body.addEventListener('htmx:afterSwap', function(e) {
      if (e.detail.target.id === 'forecast-container') {
        updateStarState();
        renderFavorites();
        startClock();
        applyUnits();
      }
    });

    // --- Back/forward navigation ---

    window.addEventListener('popstate', function() {
      var loc = parseHash();
      if (!loc) return;
      if (loc.nearby) {
        htmx.ajax('GET', '/nearby?lat=' + loc.lat + '&lon=' + loc.lon, {target: '#forecast-container'});
      } else if (loc.day) {
        loadDayForecast(loc.lat, loc.lon, loc.name, loc.day);
        document.getElementById('search-input').value = loc.name;
      } else {
        loadLocation(loc.lat, loc.lon, loc.name);
        document.getElementById('search-input').value = loc.name;
      }
    });

    // --- Page load ---

    document.addEventListener('DOMContentLoaded', function() {
      renderFavorites();
      applyUnits(); // Apply saved unit preferences

      var hashLoc = parseHash();
      if (hashLoc) {
        if (hashLoc.day) {
          loadDayForecast(hashLoc.lat, hashLoc.lon, hashLoc.name, hashLoc.day);
        } else {
          loadLocation(hashLoc.lat, hashLoc.lon, hashLoc.name);
        }
        if (hashLoc.name) {
          document.getElementById('search-input').value = hashLoc.name;
        }
      } else if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          function(pos) {
            var lat = pos.coords.latitude.toFixed(4);
            var lon = pos.coords.longitude.toFixed(4);
            htmx.ajax('GET', '/nearby?lat=' + lat + '&lon=' + lon, {target: '#forecast-container'});
            history.replaceState({nearby: true}, '', '#nearby&lat=' + lat + '&lon=' + lon);
          },
          function() {
            document.getElementById('forecast-container').innerHTML =
              '<div class="prompt">Enter a city above to get started.</div>';
          },
          { timeout: 8000 }
        );
      } else {
        document.getElementById('forecast-container').innerHTML =
          '<div class="prompt">Enter a city above to get started.</div>';
      }

      // Close settings panel when clicking outside
      document.addEventListener('click', function(e) {
        if (!e.target.closest('.settings-panel') && !e.target.closest('.settings-btn')) {
          document.getElementById('settings-panel').classList.remove('open');
        }
      });

      // Close settings on escape
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
          document.getElementById('search-input').blur();
          document.getElementById('settings-panel').classList.remove('open');
        }
      });

    });
  </script>
</body>
</html>
